name: Minipro Android Build

on:
  push:
    branches: [main]
    paths:
      - "examples/android/**"
      - ".github/workflows/minipro-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/android/**"
      - ".github/workflows/minipro-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('examples/android/**/*.kts', 'examples/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Android SDK (compileSdk 37)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;36.1.0" >/dev/null || true

      - name: Build minipro (assembleDebug)
        run: ./gradlew :minipro:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minipro-debug-apk
          path: examples/android/minipro/build/outputs/apk/debug/minipro-debug.apk
          if-no-files-found: error